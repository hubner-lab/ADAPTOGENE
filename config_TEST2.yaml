Input:
  dir: data/
  vcf: SIMDATA.vcf
  metadata: SIMDATA_metadata.tsv
  gff: SIMDATA.gff3
project_name: TEST2
Filter:
  maf: 0.05
  snp_miss: 0.1
  sample_miss: 0.5
LD:
  window: 100
  step: 20
  r2: 0.2
sNMF:
  k_start: 2
  k_end: 6
  k_best: 5.0
  repeats: 5.0
Map:
  climate_extent: auto
  gap: 0.5
  resolution: 0.5
  zoom_extent: 'NULL'
Climate:
  enabled: yes
  predictors: bio_1,bio_2,bio_3,bio_4,bio_8,bio_9,bio_10,bio_12,bio_14,bio_15
Population:
  calc_stats: no
  window_size: 3000000
  custom_trait_file: 'NULL'
Piemap:
  alpha: 0.6
  show_labels: no
  label_size: 8
  pie_scale: 1.0
  use_points: no
LDdecay:
  group_by: site
  min_samples: 10
  max_distance: 500
  scope: both
GEA:
  configs:
  - method: EMMAX
    adjust: bonf
    threshold: '0.05'
  - method: LFMM
    adjust: bonf
    threshold: '0.05'
  combine_gap: 100000
  region_distance: 1000000
  promoter_length: 10000
GFF:
  feature: mRNA
  gene_name: description
  biotype: biotype
  go_field: 'NULL'
Enrichment:
  top_terms: 20
  plot_width: 12
  plot_height: 10
  cnet_label: gene_id
Future:
  ssp: '585'
  year: 2061-2080
  models: MPI-ESM1-2-HR,UKESM1-0-LL,IPSL-CM6A-LR
Maladaptation:
  methods:
    gradient_forest:
      ntree: '1000'
      cor_threshold: '0.5'
      spatial_correction: with
      run_label: ''
      random_model: yes
      combine_method: All
      combine_gap: 100000
GEAxGWAS:
  pairwise:
    window_size: 500000
    min_snps: 2
