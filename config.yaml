Input:
  dir: data/
  vcf: Test.vcf
  metadata: Test_metadata.tsv
  gff: Test.gff3
project_name: TEST
cpu: 10
Filter:
  maf: 0.05
  snp_miss: 0.1
  sample_miss: 0.5
  relatedness: 0.99
  relatedness_action: keep
LD:
  window: 100
  step: 20
  r2: 0.2
sNMF:
  k_start: 3
  k_end: 7
  k_best: 5
  repeats: 10
Map:
  climate_extent: auto
  gap: 0.5
  resolution: 0.5
  zoom_extent: 'NULL'
Climate:
  enabled: yes
  predictors: bio_1,bio_2,bio_3,bio_4,bio_5,bio_6,bio_7,bio_8,bio_9,bio_10,bio_11,bio_12,bio_13,bio_14,bio_15,bio_16,bio_17,bio_18,bio_19
Population:
  calc_stats: no
  window_size: 3000000
  custom_trait_file: 'NULL'
Piemap:
  alpha: 0.6
  show_labels: F
  label_size: 8
  pie_scale: 1.0
  use_points: no
LDdecay:
  group_by: site
  min_samples: 10
  max_distance: 500
  scope: both
GEA:
  configs:
  - method: EMMAX
    adjust: bonf
    threshold: '0.05'
  - method: LFMM
    adjust: bonf
    threshold: '0.05'
  - method: BLINK
    adjust: bonf
    threshold: '0.05'
  snp_clumping_distance: '1000000'
  clumping_r2_threshold: 0.2
  ld_decay_group: All
  promoter_length: 10000
  wza:
    window_size: '1000000'
    fallback_window_bp: 1000000.0
GFF:
  feature: mRNA
  gene_name: description
  biotype: biotype
  go_field: ontology
Enrichment:
  top_terms: 20
  plot_width: 12
  plot_height: 10
  cnet_label: gene_id
Future:
  ssp: '585'
  year: 2061-2080
  models: MPI-ESM1-2-HR,UKESM1-0-LL,IPSL-CM6A-LR
Maladaptation:
  snp_sets: all
  methods:
    gradient_forest:
      ntree: '1000'
      cor_threshold: '0.5'
      spatial_correction: both
      random_model: yes
    geometric_offset:
      candidate_only: yes
      k: ''
      scale: yes
GEAxGWAS:
  pairwise:
    window_size: 500000
    min_snps: 2
