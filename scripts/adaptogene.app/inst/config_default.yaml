#=============================================================================
# ADAPTOGENE Default Configuration
# Copy this file to config_{project_name}.yaml and fill in your values.
# CPU cores and ploidy are managed automatically (auto-detected / diploid).
#=============================================================================

#-----------------------------------------------------------------------------
# INPUT: Files and project settings
#-----------------------------------------------------------------------------
Input:
  dir: ""                          # Directory containing input files (relative to /pipeline/)
  vcf: ""                          # VCF file (.vcf or .vcf.gz)
  metadata: ""                     # Sample metadata TSV (columns: site, sample, latitude, longitude)
  gff: ""                          # GFF3 file for gene annotation (optional, leave empty to skip)

project_name: ""                   # Output directory prefix: {project_name}_results/

#-----------------------------------------------------------------------------
# FILTER: VCF quality filtering
#-----------------------------------------------------------------------------
Filter:
  maf: 0.05                        # Minor allele frequency threshold
  snp_miss: 0.1                    # Max SNP missingness (remove SNPs missing in >10% samples)
  sample_miss: 0.5                 # Max sample missingness (remove samples with >50% missing)
  min_depth: null                  # Optional: mask genotypes with FORMAT/DP < N (null = skip)
  max_depth: null                  # Optional: mask genotypes with FORMAT/DP > N (null = skip)
  het_outlier_sd: null             # Optional: remove samples with heterozygosity beyond N SDs (null = skip)
  relatedness: 0.99                # IBS allele-sharing threshold for coloring/counting related pairs (duplicates cluster ~1.0); liberal default, colors/counts only
  relatedness_action: keep         # keep (default): visualize/count only, remove nothing. remove: drop the higher-missingness member of each pair above the threshold

#-----------------------------------------------------------------------------
# LD: Linkage disequilibrium pruning
#-----------------------------------------------------------------------------
LD:
  window: 100                      # Window size in kb for LD calculation
  step: 20                         # Step size for sliding window
  r2: 0.2                          # R^2 threshold (keep SNPs with r^2 < this value)

#-----------------------------------------------------------------------------
# SNMF: Population structure inference
#-----------------------------------------------------------------------------
sNMF:
  k_start: 2                       # Minimum K (number of ancestral populations) to test
  k_end: 6                         # Maximum K to test
  k_best: null                     # Set after reviewing cross-entropy plots
  repeats: 10                      # Repetitions per K (higher = more stable)

#-----------------------------------------------------------------------------
# MAP: Geographic extent and resolution for climate data
#-----------------------------------------------------------------------------
Map:
  climate_extent: "auto"           # [min_lon, max_lon, min_lat, max_lat] or "auto"
  gap: 0.5                         # Buffer around samples in degrees (only if auto)
  resolution: 0.5                  # Climate data resolution in arc-minutes (0.5, 2.5, 5, 10)
  zoom_extent: "NULL"              # Optional zoom: "xmin,xmax,ymin,ymax" or "NULL"

#-----------------------------------------------------------------------------
# CLIMATE: Bioclimatic variables
#-----------------------------------------------------------------------------
Climate:
  enabled: true                    # Set false to skip all climate-dependent analyses
  predictors: "bio_1,bio_2,bio_3,bio_4,bio_8,bio_9,bio_10,bio_12,bio_14,bio_15"

#-----------------------------------------------------------------------------
# POPULATION STATS
#-----------------------------------------------------------------------------
Population:
  calc_stats: false                # Calculate Tajima's D, Pi, AMOVA, IBD (requires >=3 samples/pop)
  window_size: 3000000             # Window size in bp for Tajima's D and Pi diversity
  custom_trait_file: "NULL"        # Custom trait file for piemap sizing (site + trait columns)

#-----------------------------------------------------------------------------
# PIEMAP: Population structure visualization
#-----------------------------------------------------------------------------
Piemap:
  alpha: 0.6                       # Pie chart transparency (0-1)
  show_labels: false               # Show population labels
  label_size: 8                    # Label font size
  pie_scale: 1.0                   # Pie chart size scale factor
  use_points: false                # Use colored points instead of pie charts

#-----------------------------------------------------------------------------
# LDdecay: Linkage disequilibrium decay analysis
#-----------------------------------------------------------------------------
LDdecay:
  group_by: "site"                 # "site" or "cluster" (sNMF K_BEST clusters)
  min_samples: 10                  # Groups below this are skipped
  max_distance: 500                # Max pairwise distance in kb
  scope: "both"                    # "genome_wide", "per_chromosome", or "both"

#-----------------------------------------------------------------------------
# GEA: Association analysis settings
#-----------------------------------------------------------------------------
GEA:
  configs:
    - method: "EMMAX"
      adjust: "bonf"
      threshold: '0.05'
    - method: "LFMM"
      adjust: "bonf"
      threshold: '0.05'
  snp_clumping_distance: 100000    # Region merge distance (bp), fixed default — tune interactively
                                    # in the GEA tab's filter bar (or "auto_genome_wide"/"auto_per_chromosome"
                                    # to derive it from the LD decay table instead)
  promoter_length: 10000           # Promoter region length for SNP annotation

#-----------------------------------------------------------------------------
# PREGEA: GEA hyperparameter exploration (mode=pregea, LD-pruned dataset only)
#-----------------------------------------------------------------------------
PreGEA:
  seed: 42
  LFMM:
    enabled: yes
    k_offset_low: -1          # K sweep = [k_best + low, k_best + high]
    k_offset_high: 2
    k_min: 1                  # hard floor (lfmm2 requires K >= 1)
    predictors: auto          # 'auto' = Climate.predictors; or a comma-separated subset
    genomic_control: no       # FALSE so lambda IS informative; the production GEA run uses TRUE
    fdr: 0.1                  # hit-count-vs-K panel (qvalue)
    bonf_alpha: 0.05          # second hit-count series
  EMMAX:
    enabled: yes
    n_pcs_min: 0               # 0 = kinship-only reference panel
    n_pcs_max: 10
    kinship: BN                # BN | IBS (matches GEA.EMMAX.kinship semantics)
    predictors: auto
    fdr: 0.1
    bonf_alpha: 0.05
    lambda_tol: 0.15           # |lambda-1| tolerance for the "knee" recommendation
    deflation_floor: 0.90      # reference line; lambda below this = over-correction flag
  RDA:
    enabled: yes
    condition_pcs_min: 0
    condition_pcs_max: 6
    collinearity_r: 0.7        # |r| pre-screen
    vif_max: 10.0               # post-fit vif.cca cutoff
    min_predictors: 2          # never pre-screen below this (RDA + covRob both need >=2)
    axis_alpha: 0.05
    permutations: 999
  Varpart:
    enabled: yes
    response: pcs               # 'pcs' = documented scalability adaptation | 'snps'
    response_var_cutoff: 0.8    # cumulative variance of LEA PCs retained as Y
    response_max_pcs: 20
    response_min_pcs: 2         # floor so varpart always has a multivariate Y
    structure_table: qmatrix    # 'qmatrix' (sNMF Q at k_best, last column dropped) | 'none'
    spatial_level: auto         # auto | site | sample
    min_sites: 6                 # below this -> dbMEM writes a skip record, no crash
    ordir2step_pin: 0.01         # Blanchet double stopping rule
    ordir2step_permutations: 999
    r2_permutations: 1000        # Peres-Neto et al. 2006 R2permutations
    varpart_permutations: 999    # anova.cca per testable fraction
    confounding_flag: yes       # auto-flag when shared > max(unique) fraction
  TransferGuard:
    enabled: no                 # OFF by default: pulls the FULL-set imputation chain into a pruned-only mode
    lfmm_k: auto                # 'auto' resolves from pregea_recommendations.tsv inside the script
    emmax_n_pcs: auto

#-----------------------------------------------------------------------------
# GWAS: Phenotype association settings
#-----------------------------------------------------------------------------
GWAS:
  configs:
    - method: "EMMAX"
      adjust: "bonf"
      threshold: '0.05'
    - method: "BLINK"
      adjust: "bonf"
      threshold: '0.05'
  missing_strategy: "DROP"         # How to handle samples missing phenotype data
  snp_clumping_distance: 100000    # Region merge distance (bp), fixed default — tune interactively
                                    # in the GWAS tab's filter bar
  promoter_length: 10000           # Promoter region length for SNP annotation

#-----------------------------------------------------------------------------
# GFF: Gene annotation parsing
#-----------------------------------------------------------------------------
GFF:
  feature: "mRNA"                  # Feature type to extract
  gene_name: "description"         # Attribute for gene names
  biotype: "biotype"               # Attribute for gene biotype
  go_field: "NULL"                 # GFF attribute with GO terms (NULL to skip enrichment)

#-----------------------------------------------------------------------------
# ENRICHMENT: GO enrichment visualization
#-----------------------------------------------------------------------------
Enrichment:
  top_terms: 20                    # Number of top enriched terms in plots
  plot_width: 12
  plot_height: 10
  cnet_label: "gene_id"            # Gene label in cnetplot: "gene_id", "Name", "description"

#-----------------------------------------------------------------------------
# FUTURE CLIMATE: Projections for maladaptation analysis
#-----------------------------------------------------------------------------
Future:
  ssp: '585'                       # Shared Socioeconomic Pathway (126, 245, 370, 585)
  year: '2061-2080'                # Time period for projections
  models: 'MPI-ESM1-2-HR,UKESM1-0-LL,IPSL-CM6A-LR'

#-----------------------------------------------------------------------------
# MALADAPTATION: Gradient Forest modeling for genetic offset
#-----------------------------------------------------------------------------
Maladaptation:
  methods:
    gradient_forest:
      ntree: '1000'
      cor_threshold: '0.5'
      spatial_correction: 'with'       # Include spatial variables: with/without
      random_model: true               # Also build neutral model for comparison
  snp_sets: 'all'                      # SNP set(s) to run maladaptation on — 'all' or a list of
                                        # names saved from the GEA tab's "Save SNP set" action

#-----------------------------------------------------------------------------
# OVERLAP: Combined GEA + GWAS analysis (mode=overlapping)
#-----------------------------------------------------------------------------
GEAxGWAS:
  pairwise:
    window_size: 500000
    min_snps: 2
